<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSE Launcher Setup</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="window">
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <svg class="brand-logo" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
            <circle cx="16" cy="16" r="14" fill="#00af5c" />
            <path d="M16 6.5 25 11.7v8.6L16 25.5 7 20.3v-8.6z" fill="#ffffff" opacity="0.92" />
            <path d="M16 6.5 25 11.7 16 16.9 7 11.7z" fill="#c9f6dd" />
          </svg>
          <span class="brand-name">MSE Launcher</span>
          <span class="version-pill" id="version-pill">1.2.0-beta</span>
        </div>

        <div class="titlebar-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" id="lang-id" data-lang="id">ID</button>
            <button type="button" class="lang-btn" id="lang-en" data-lang="en">EN</button>
          </div>
          <button type="button" class="win-btn" id="btn-minimize" aria-label="Minimize">
            <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
              <path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="win-btn win-btn-close" id="btn-close" aria-label="Close">
            <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
              <path
                d="M2.5 2.5l7 7M9.5 2.5l-7 7"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <main class="content">
        <!-- INSTALL: CONFIGURE -->
        <section id="view-install" class="view">
          <div class="hero">
            <h1 id="install-title">Pasang MSE Launcher</h1>
            <p id="install-subtitle" class="subtitle"></p>
          </div>

          <div class="mode-grid" role="radiogroup" aria-labelledby="install-title">
            <button type="button" class="mode-card active" id="mode-standard" data-mode="install">
              <div class="mode-card-head">
                <span class="mode-title" id="mode-std-title"></span>
                <span class="mode-badge" id="mode-std-badge"></span>
              </div>
              <p class="mode-desc" id="mode-std-desc"></p>
            </button>

            <button type="button" class="mode-card" id="mode-portable" data-mode="portable">
              <div class="mode-card-head">
                <span class="mode-title" id="mode-port-title"></span>
                <span class="mode-badge mode-badge-muted" id="mode-port-badge"></span>
              </div>
              <p class="mode-desc" id="mode-port-desc"></p>
            </button>
          </div>

          <div class="panel">
            <label class="field-label" for="path-input" id="path-label"></label>
            <div class="path-row">
              <input
                type="text"
                id="path-input"
                class="path-input"
                spellcheck="false"
                autocomplete="off"
              />
              <button type="button" class="btn-secondary" id="btn-browse"></button>
            </div>
            <p class="path-hint" id="path-hint"></p>

            <div class="checks">
              <label class="check-item" id="row-desktop-sc">
                <input type="checkbox" id="chk-desktop" checked />
                <span id="lbl-desktop"></span>
              </label>
              <label class="check-item" id="row-start-sc">
                <input type="checkbox" id="chk-start" checked />
                <span id="lbl-start"></span>
              </label>
            </div>
          </div>

          <div id="payload-warning" class="alert-error hidden"></div>

          <footer class="footer">
            <button type="button" class="btn-ghost" id="btn-cancel-install"></button>
            <button type="button" class="btn-primary" id="btn-start-install"></button>
          </footer>
        </section>

        <!-- UNINSTALL: CONFIRM -->
        <section id="view-uninstall" class="view hidden">
          <div class="hero">
            <h1 id="uninstall-title"></h1>
            <p id="uninstall-subtitle" class="subtitle"></p>
          </div>

          <div class="panel">
            <div class="info-row">
              <span class="info-key" id="uninstall-dir-label"></span>
              <span class="info-val" id="uninstall-dir-value"></span>
            </div>
            <div class="checks" style="margin-top: 14px;">
              <label class="check-item">
                <input type="checkbox" id="chk-remove-data" />
                <span id="lbl-remove-data"></span>
              </label>
            </div>
            <p class="path-hint" id="uninstall-data-hint"></p>
          </div>

          <footer class="footer">
            <button type="button" class="btn-ghost" id="btn-cancel-uninstall"></button>
            <button type="button" class="btn-danger" id="btn-start-uninstall"></button>
          </footer>
        </section>

        <!-- PROGRESS -->
        <section id="view-progress" class="view hidden">
          <div class="center-card">
            <div class="spinner" aria-hidden="true"></div>
            <h2 id="progress-title"></h2>
            <p id="progress-stage" class="subtitle"></p>
            <div class="progress-track">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="progress-pct" id="progress-pct">0%</span>
          </div>
        </section>

        <!-- DONE -->
        <section id="view-done" class="view hidden">
          <div class="center-card">
            <div class="done-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="28" height="28">
                <path
                  d="M5 12.5l4.5 4.5L19 7.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <h2 id="done-title"></h2>
            <p id="done-subtitle" class="subtitle"></p>
            <label class="check-item done-launch-check" id="row-launch-after">
              <input type="checkbox" id="chk-launch-after" checked />
              <span id="lbl-launch-after"></span>
            </label>
          </div>

          <footer class="footer">
            <span></span>
            <button type="button" class="btn-primary" id="btn-finish"></button>
          </footer>
        </section>

        <!-- ERROR -->
        <section id="view-error" class="view hidden">
          <div class="center-card">
            <h2 id="error-title"></h2>
            <p id="error-message" class="error-detail"></p>
          </div>
          <footer class="footer">
            <button type="button" class="btn-ghost" id="btn-error-back"></button>
            <button type="button" class="btn-secondary" id="btn-error-close"></button>
          </footer>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
