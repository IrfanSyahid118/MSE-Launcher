name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.2.1-beta)'
        required: false
        type: string
      publish:
        description: 'Publish artifacts to GitHub Releases'
        required: false
        default: false
        type: boolean

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Build Windows installers and binary
        env:
          MCLAUNCHER_DEFAULT_CF_PROXY: ${{ secrets.MCLAUNCHER_DEFAULT_CF_PROXY }}
        run: pnpm build

      - name: Build custom installer stub
        run: cargo build --release -p launcher-installer

      - name: Stage Windows release assets
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cargoMatch = Select-String -Path 'Cargo.toml' -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value.Trim()

          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref }}' -notlike 'refs/tags/*') {
            $inputTag = '${{ inputs.tag }}'
            if (-not [string]::IsNullOrWhiteSpace($inputTag)) {
              $tag = $inputTag.Trim()
            } else {
              $tag = "v$cargoVersion"
            }
          }
          $releaseVersion = $tag -replace '^[vV]', ''
          if ($releaseVersion -ne $cargoVersion) {
            throw "Release tag version '$releaseVersion' does not match Cargo.toml version '$cargoVersion'."
          }

          $outDir = Join-Path $PWD 'release-assets/windows'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $msiFile = Get-ChildItem -Path 'target/release/bundle/msi' -Filter '*.msi' | Select-Object -First 1
          $portableSrc = Get-Item 'target/release/minecraft-launcher-desktop.exe'
          $installerStub = Get-Item 'target/release/launcher-installer.exe'

          if (-not $msiFile -or -not $portableSrc -or -not $installerStub) {
            throw 'Expected Windows Tauri build artifacts were not found in target/release.'
          }

          $nsisName = "MSE.Launcher_${releaseVersion}_x64-setup.exe"
          $msiName = "MSE.Launcher_${releaseVersion}_x64_en-US.msi"
          $portableName = "MSE.Launcher_${releaseVersion}_Portable.exe"

          $nsisOut = Join-Path $outDir $nsisName
          $msiOut = Join-Path $outDir $msiName
          $portableOut = Join-Path $outDir $portableName

          & pwsh -NoProfile -ExecutionPolicy Bypass -File 'scripts/package-installer.ps1' `
            -StubExe $installerStub.FullName `
            -AppExe $portableSrc.FullName `
            -Version $releaseVersion `
            -OutExe $nsisOut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item $msiFile.FullName $msiOut -Force
          Copy-Item $portableSrc.FullName $portableOut -Force

          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $winPlatform = [ordered]@{
            installer = [ordered]@{
              name   = $nsisName
              url    = "$baseUrl/$nsisName"
              sha256 = (Get-FileHash $nsisOut -Algorithm SHA256).Hash.ToLowerInvariant()
              size   = (Get-Item $nsisOut).Length
            }
            portable = [ordered]@{
              name   = $portableName
              url    = "$baseUrl/$portableName"
              sha256 = (Get-FileHash $portableOut -Algorithm SHA256).Hash.ToLowerInvariant()
              size   = (Get-Item $portableOut).Length
            }
            msi = [ordered]@{
              name   = $msiName
              url    = "$baseUrl/$msiName"
              sha256 = (Get-FileHash $msiOut -Algorithm SHA256).Hash.ToLowerInvariant()
              size   = (Get-Item $msiOut).Length
            }
          }

          $metaPath = Join-Path $outDir 'windows-platform.json'
          [System.IO.File]::WriteAllText(
            $metaPath,
            ($winPlatform | ConvertTo-Json -Depth 6),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/windows/
          retention-days: 7

  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Build Ubuntu bundles and binary
        env:
          MCLAUNCHER_DEFAULT_CF_PROXY: ${{ secrets.MCLAUNCHER_DEFAULT_CF_PROXY }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm exec tauri build --bundles deb,appimage

      - name: Stage Ubuntu release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cargoMatch = Select-String -Path 'Cargo.toml' -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value.Trim()

          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref }}' -notlike 'refs/tags/*') {
            $inputTag = '${{ inputs.tag }}'
            if (-not [string]::IsNullOrWhiteSpace($inputTag)) {
              $tag = $inputTag.Trim()
            } else {
              $tag = "v$cargoVersion"
            }
          }
          $releaseVersion = $tag -replace '^[vV]', ''
          if ($releaseVersion -ne $cargoVersion) {
            throw "Release tag version '$releaseVersion' does not match Cargo.toml version '$cargoVersion'."
          }

          $outDir = Join-Path $PWD 'release-assets/ubuntu'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $debFile = Get-ChildItem -Path 'target/release/bundle/deb' -Filter '*.deb' | Select-Object -First 1
          $appImageFile = Get-ChildItem -Path 'target/release/bundle/appimage' -Filter '*.AppImage' | Select-Object -First 1
          $binSrc = Get-Item 'target/release/minecraft-launcher-desktop'

          if (-not $debFile -or -not $appImageFile -or -not $binSrc) {
            throw 'Expected Ubuntu Tauri build artifacts were not found in target/release.'
          }

          $debName = "MSE.Launcher_${releaseVersion}_amd64.deb"
          $appImageName = "MSE.Launcher_${releaseVersion}_amd64.AppImage"
          $tarName = "MSE.Launcher_${releaseVersion}_linux-x86_64.tar.gz"

          $debOut = Join-Path $outDir $debName
          $appImageOut = Join-Path $outDir $appImageName
          $tarOut = Join-Path $outDir $tarName

          Copy-Item $debFile.FullName $debOut -Force
          Copy-Item $appImageFile.FullName $appImageOut -Force
          tar -czf $tarOut -C 'target/release' 'minecraft-launcher-desktop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $linuxPlatform = [ordered]@{
            installer = [ordered]@{
              name   = $debName
              url    = "$baseUrl/$debName"
              sha256 = (Get-FileHash $debOut -Algorithm SHA256).Hash.ToLowerInvariant()
              size   = (Get-Item $debOut).Length
            }
            portable = [ordered]@{
              name   = $appImageName
              url    = "$baseUrl/$appImageName"
              sha256 = (Get-FileHash $appImageOut -Algorithm SHA256).Hash.ToLowerInvariant()
              size   = (Get-Item $appImageOut).Length
            }
            tarball = [ordered]@{
              name   = $tarName
              url    = "$baseUrl/$tarName"
              sha256 = (Get-FileHash $tarOut -Algorithm SHA256).Hash.ToLowerInvariant()
              size   = (Get-Item $tarOut).Length
            }
          }

          $metaPath = Join-Path $outDir 'linux-platform.json'
          [System.IO.File]::WriteAllText(
            $metaPath,
            ($linuxPlatform | ConvertTo-Json -Depth 6),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ubuntu
          path: release-assets/ubuntu/
          retention-days: 7

  publish-release:
    needs: [build-windows, build-ubuntu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets

      - name: Download Ubuntu artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-ubuntu
          path: release-assets

      - name: Merge latest.json and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $cargoMatch = Select-String -Path 'Cargo.toml' -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargoVersion = $cargoMatch.Matches[0].Groups[1].Value.Trim()

          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref }}' -notlike 'refs/tags/*') {
            $inputTag = '${{ inputs.tag }}'
            if (-not [string]::IsNullOrWhiteSpace($inputTag)) {
              $tag = $inputTag.Trim()
            } else {
              $tag = "v$cargoVersion"
            }
          }
          $releaseVersion = $tag -replace '^[vV]', ''

          $winMetaPath = 'release-assets/windows-platform.json'
          $linuxMetaPath = 'release-assets/linux-platform.json'
          $winPlatform = Get-Content -Raw $winMetaPath | ConvertFrom-Json
          $linuxPlatform = Get-Content -Raw $linuxMetaPath | ConvertFrom-Json

          Remove-Item $winMetaPath, $linuxMetaPath -Force

          $manifest = [ordered]@{
            version     = $releaseVersion
            notes       = "MSE Launcher $releaseVersion"
            publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms   = [ordered]@{
              'windows-x86_64' = $winPlatform
              'linux-x86_64'   = $linuxPlatform
            }
          }

          $latestPath = 'release-assets/latest.json'
          [System.IO.File]::WriteAllText(
            $latestPath,
            ($manifest | ConvertTo-Json -Depth 6),
            [System.Text.UTF8Encoding]::new($false)
          )

          $isPrerelease = if ($tag -match '-(alpha|beta|rc)') { 'true' } else { 'false' }
          $files = @(Get-ChildItem -Path 'release-assets' -File | Select-Object -ExpandProperty FullName)

          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevEap

          if ($exists) {
            & gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $argsList = @('release', 'create', $tag) + $files + @(
              '--title', "$tag - MSE Launcher $releaseVersion",
              '--generate-notes'
            )
            if ($isPrerelease -eq 'true') {
              $argsList += '--prerelease'
            }
            & gh @argsList
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
