[package]
name = "minecraft-launcher-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["protocol-asset"] }
tauri-plugin-opener = "2.2"
tauri-plugin-single-instance = "2"
launcher-types = { path = "../crates/launcher-types" }
launcher-platform = { path = "../crates/launcher-platform" }
launcher-security = { path = "../crates/launcher-security" }
launcher-storage = { path = "../crates/launcher-storage" }
launcher-net = { path = "../crates/launcher-net" }
launcher-download = { path = "../crates/launcher-download" }
launcher-version = { path = "../crates/launcher-version" }
launcher-java = { path = "../crates/launcher-java" }
launcher-loader = { path = "../crates/launcher-loader" }
launcher-launch = { path = "../crates/launcher-launch" }
launcher-servers = { path = "../crates/launcher-servers" }
launcher-content = { path = "../crates/launcher-content" }
launcher-auth = { path = "../crates/launcher-auth" }
launcher-archive = { path = "../crates/launcher-archive" }
launcher-discord = { path = "../crates/launcher-discord" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
